
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neighbor Games | Hello Neighbor Status</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #203b65, transparent 55%),
        #080d18;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .card {
      background: rgba(18, 29, 49, .95);
      border: 1px solid #304968;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 18px;
      box-shadow: 0 15px 45px #0006;
    }

    h1, h2 { margin-top: 0; }
    h1 { font-size: 30px; }

    .subtitle {
      color: #9eb3d1;
      margin-top: -10px;
    }

    .status {
      font-size: 25px;
      font-weight: bold;
      margin: 18px 0 10px;
    }

    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 9px;
      background: #aaa;
    }

    .online { color: #4ade80; }
    .online .dot { background: #4ade80; }

    .maintenance { color: #facc15; }
    .maintenance .dot { background: #facc15; }

    .private { color: #c084fc; }
    .private .dot { background: #c084fc; }

    .updating { color: #60a5fa; }
    .updating .dot { background: #60a5fa; }

    .unavailable { color: #f87171; }
    .unavailable .dot { background: #f87171; }

    .announcement {
      background: #0d1729;
      border: 1px solid #263b57;
      border-radius: 10px;
      padding: 12px 15px;
      margin-top: 18px;
    }

    .announcement-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .announcement-header strong {
      font-size: 14px;
    }

    .announcement-header button {
      width: auto;
      margin: 0;
      padding: 7px 10px;
      font-size: 12px;
    }

    .announcement-text {
      color: #d6e2f3;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 12px 0 0;
      line-height: 1.5;
    }

    .announcement-text.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .muted {
      color: #8295b1;
      font-size: 13px;
    }

    input, textarea, select {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #405775;
      border-radius: 9px;
      background: #0c1627;
      color: white;
      font: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #3978d5;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover { background: #5090ed; }
    button.secondary { background: #34445c; }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      color: #fca5a5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .success { color: #4ade80; }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      color: #71839e;
      font-size: 12px;
      padding: 8px;
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="card">
      <h1>Neighbor Games</h1>
      <p class="subtitle">Hello Neighbor | Official Game Status</p>

      <div id="status" class="status">
        <span class="dot"></span>Loading...
      </div>

      <p id="description" class="muted">
        Checking the latest game status.
      </p>

      <div class="announcement">
        <div class="announcement-header">
          <strong>Announcement</strong>
          <button id="announcement-toggle" type="button">
            Read more +
          </button>
        </div>

        <p id="announcement" class="announcement-text collapsed">
          Loading announcement...
        </p>
      </div>

      <p class="muted">
        Last updated: <span id="updated">Loading...</span>
      </p>
    </section>

    <section class="card">
      <h2>Administrator Login</h2>

      <div id="login-area">
        <input id="email" type="email" placeholder="Admin email">
        <input id="password" type="password" placeholder="Password">
        <button id="login-button">Log In</button>
      </div>

      <div id="admin-area" class="hidden">
        <p class="muted">You are logged in as an administrator.</p>

        <label for="new-status">Game status</label>
        <select id="new-status">
          <option value="online">Online</option>
          <option value="maintenance">Under Maintenance</option>
          <option value="private">Private</option>
          <option value="updating">Updating</option>
          <option value="unavailable">Temporarily Unavailable</option>
        </select>

        <label for="new-announcement">Announcement</label>
        <textarea
          id="new-announcement"
          placeholder="Write a game announcement..."
        ></textarea>

        <button id="save-button">Save Changes</button>
        <button id="logout-button" class="secondary">Log Out</button>
      </div>

      <p id="admin-message" class="error"></p>
    </section>

    <footer>
      Neighbor Games | Manual Status System
    </footer>

  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const descriptions = {
      online: "Hello Neighbor is currently available.",
      maintenance: "The game is undergoing maintenance.",
      private: "The game is currently private.",
      updating: "A game update is currently in progress.",
      unavailable: "The game is temporarily unavailable."
    };

    const labels = {
      online: "Online",
      maintenance: "Under Maintenance",
      private: "Private",
      updating: "Updating",
      unavailable: "Temporarily Unavailable"
    };

    let db = null;

    // Prevent automatic refreshes from overwriting unsaved edits.
    let editorDirty = false;
    let saving = false;

    $("new-announcement").addEventListener("input", () => {
      editorDirty = true;
    });

    $("new-status").addEventListener("change", () => {
      editorDirty = true;
    });

    function showError(message) {
      $("status").textContent = "Connection error";
      $("description").textContent = message;
      console.error("Neighbor Games error:", message);
    }

    function setEditorValues(data) {
      if (editorDirty || saving) return;

      $("new-status").value = data.status || "online";
      $("new-announcement").value = data.announcement || "";
    }

    function displayStatus(data) {
      const status = data.status || "unavailable";

      $("status").className = "status " + status;
      $("status").innerHTML =
        '<span class="dot"></span>' +
        (labels[status] || status);

      $("description").textContent =
        descriptions[status] || "Status information unavailable.";

      $("announcement").textContent =
        data.announcement || "No announcements at this time.";

      $("updated").textContent = data.updated_at
        ? new Date(data.updated_at).toLocaleString()
        : "Not available";

      setEditorValues(data);
      updateAnnouncementButton();
    }

    function updateAnnouncementButton() {
      const text = $("announcement");
      const button = $("announcement-toggle");

      const isLong = text.scrollHeight > text.clientHeight + 2;

      if (text.classList.contains("collapsed") && !isLong) {
        button.classList.add("hidden");
      } else {
        button.classList.remove("hidden");
      }

      button.textContent = text.classList.contains("collapsed")
        ? "Read more +"
        : "Show less −";
    }

    $("announcement-toggle").addEventListener("click", () => {
      $("announcement").classList.toggle("collapsed");
      updateAnnouncementButton();
    });

    async function loadStatus() {
      if (!db) return;

      const { data, error } = await db
        .from("game_status")
        .select("id,status,announcement,updated_at")
        .eq("id", 1)
        .maybeSingle();

      if (error) {
        showError(error.message + " (Code: " + error.code + ")");
        return;
      }

      if (!data) {
        showError("No status row found with id = 1.");
        return;
      }

      displayStatus(data);
    }

    async function checkAdmin() {
      const { data: { session }, error } =
        await db.auth.getSession();

      if (error) {
        $("admin-message").textContent = error.message;
        return;
      }

      if (!session) {
        $("login-area").classList.remove("hidden");
        $("admin-area").classList.add("hidden");
        editorDirty = false;
        return;
      }

      const { data, error: adminError } = await db
        .from("status_admins")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (adminError) {
        $("admin-message").textContent =
          "Admin check failed: " + adminError.message;
        return;
      }

      if (!data) {
        $("admin-message").textContent =
          "This account is not authorized as an admin.";
        await db.auth.signOut();
        return;
      }

      $("admin-message").textContent = "";
      $("login-area").classList.add("hidden");
      $("admin-area").classList.remove("hidden");

      // Load the latest saved editor values after authentication.
      if (!editorDirty) {
        const { data: statusData, error: statusError } = await db
          .from("game_status")
          .select("status,announcement")
          .eq("id", 1)
          .maybeSingle();

        if (!statusError && statusData) {
          setEditorValues(statusData);
        }
      }
    }

    async function login() {
      $("admin-message").textContent = "";

      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        $("admin-message").textContent =
          "Enter your email and password.";
        return;
      }

      $("login-button").disabled = true;
      $("login-button").textContent = "Logging in...";

      try {
        const { error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          $("admin-message").textContent = error.message;
          return;
        }

        editorDirty = false;
        await checkAdmin();

      } finally {
        $("login-button").disabled = false;
        $("login-button").textContent = "Log In";
      }
    }

    async function saveStatus() {
      if (saving) return;

      saving = true;
      $("save-button").disabled = true;
      $("save-button").textContent = "Saving...";
      $("admin-message").className = "error";
      $("admin-message").textContent = "";

      const status = $("new-status").value;
      const announcement = $("new-announcement").value;

      try {
        const { data, error } = await db
          .from("game_status")
          .update({
            status,
            announcement,
            updated_at: new Date().toISOString()
          })
          .eq("id", 1)
          .select()
          .maybeSingle();

        if (error) {
          $("admin-message").textContent =
            "Save failed: " + error.message;
          return;
        }

        if (!data) {
          $("admin-message").textContent =
            "No row updated. Check your admin permissions.";
          return;
        }

        // Only clear the unsaved-edit protection after a successful save.
        editorDirty = false;

        displayStatus(data);

        $("admin-message").className = "success";
        $("admin-message").textContent =
          "Changes saved successfully!";

      } catch (error) {
        $("admin-message").textContent =
          "Unexpected error: " + error.message;

      } finally {
        saving = false;
        $("save-button").disabled = false;
        $("save-button").textContent = "Save Changes";
      }
    }

    async function logout() {
      const { error } = await db.auth.signOut();

      if (error) {
        $("admin-message").textContent = error.message;
        return;
      }

      editorDirty = false;
      $("admin-message").textContent = "";
      await checkAdmin();
    }

    async function initialize() {
      const config = window.APP_CONFIG || {};

      if (!config.url || !config.key) {
        showError("Missing Supabase configuration in config.js.");
        return;
      }

      if (!window.supabase) {
        showError("Supabase library failed to load.");
        return;
      }

      try {
        db = window.supabase.createClient(
          config.url,
          config.key
        );

        await loadStatus();
        await checkAdmin();

        db.auth.onAuthStateChange(() => {
          checkAdmin();
        });

        // Refresh public information without overwriting unsaved edits.
        setInterval(loadStatus, 30000);

      } catch (error) {
        showError(error.message || "Unknown initialization error.");
      }
    }

    $("login-button").addEventListener("click", login);
    $("save-button").addEventListener("click", saveStatus);
    $("logout-button").addEventListener("click", logout);

    initialize();
  </script>
</body>
</html>
